version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: finance_app_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - finance_app_data:/var/lib/postgresql/data
    networks:
      - finance_network

networks:
  finance_network:
    driver: bridge

volumes:
  finance_app_data:
